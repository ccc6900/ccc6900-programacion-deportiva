<body>

<!-- Estadísticas de las fuentes -->

<script>
const $ = id => document.getElementById(id);

let ev = [];
let meta = {};

/* Normalización de texto */
function normalizarTexto(valor){
  return String(valor ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

/* Identificar el deporte y traducir su nombre */
function normalizarDeporte(deporte){
  const d = normalizarTexto(deporte);

  if(
    d.includes("basketball") ||
    d.includes("baloncesto") ||
    d === "nba" || d === "wnba" || d === "acb"
  ){
    return "Baloncesto";
  }

  if(d.includes("motogp") || d.includes("moto gp")){
    return "MotoGP";
  }

  if(
    d.includes("american football") ||
    d.includes("futbol americano")
  ){
    return "Fútbol americano";
  }

  if(
    d === "football" || d === "soccer" ||
    d.includes("football") || d.includes("soccer") ||
    d.includes("futbol")
  ){
    return "Fútbol";
  }

  const traducciones = {
    "tennis":"Tenis",
    "table tennis":"Tenis de mesa",
    "volleyball":"Voleibol",
    "handball":"Balonmano",
    "ice hockey":"Hockey sobre hielo",
    "field hockey":"Hockey sobre hierba",
    "rugby":"Rugby",
    "cycling":"Ciclismo",
    "formula 1":"Fórmula 1",
    "formula one":"Fórmula 1",
    "f1":"Fórmula 1",
    "boxing":"Boxeo",
    "golf":"Golf",
    "cricket":"Críquet",
    "baseball":"Béisbol",
    "athletics":"Atletismo",
    "swimming":"Natación",
    "badminton":"Bádminton",
    "snooker":"Snooker",
    "darts":"Dardos",
    "esports":"Deportes electrónicos",
    "motorcycle racing":"Motociclismo",
    "motorsport":"Deportes de motor",
    "horse racing":"Hípica",
    "mma":"Artes marciales mixtas",
    "wrestling":"Lucha libre"
  };

  if(traducciones[d]) return traducciones[d];
  return String(deporte || "Otros deportes").trim();
}

/* Normalizar las competiciones conocidas */
function normalizarCompeticion(liga){
  const original = String(liga ?? "").trim();
  const l = normalizarTexto(original);

  if(!l) return "";

  if(
    l.includes("copa del rey") ||
    l.includes("king's cup") ||
    l.includes("copa de s.m. el rey")
  ){
    return "Copa del Rey";
  }

  if(
    l.includes("conference league") ||
    l.includes("uefa conference")
  ){
    return "UEFA Conference League";
  }

  if(
    l.includes("europa league") ||
    l.includes("europe league") ||
    l.includes("uefa cup")
  ){
    return "UEFA Europa League";
  }

  if(
    l.includes("champions league") ||
    l.includes("uefa champions")
  ){
    return "UEFA Champions League";
  }

  if(
    l === "laliga" ||
    l.includes("la liga") ||
    l.includes("primera division") ||
    l.includes("spanish primera")
  ){
    return "La Liga";
  }

  if(
    l.includes("premier league") &&
    !l.includes("scottish") &&
    !l.includes("indian")
  ){
    return "Premier League England";
  }

  if(l.includes("bundesliga")){
    return "Bundesliga";
  }

  if(
    l === "acb" ||
    l.includes("liga endesa") ||
    l.includes("liga acb")
  ){
    return "ACB";
  }

  if(
    l.includes("euroleague") ||
    l.includes("euro liga") ||
    l.includes("euroliga")
  ){
    return "Euroliga";
  }

  return original;
}

function claveCompeticion(liga){
  return normalizarTexto(normalizarCompeticion(liga));
}

/* Mantener el tratamiento de las horas de los eventos */
function hora(ts){
  if(!ts) return "Hora por confirmar";

  const d = new Date(
    /[zZ]|[+-]\d\d:?\d\d$/.test(ts)
      ? ts
      : ts + "Z"
  );

  return isNaN(d)
    ? "Hora por confirmar"
    : d.toLocaleTimeString("es-ES",{
        hour:"2-digit",
        minute:"2-digit"
      });
}

function comparar(a,b){
  return a.localeCompare(b,"es",{sensitivity:"base"});
}

/*
  Panel de estadísticas:
  utiliza las estadísticas guardadas por el recopilador.
  Admite objetos, listas y distintos nombres de campos.
*/
function mostrarFuentes(){
  const contenedor = $("fuentes-contenido");
  contenedor.innerHTML = "";

  const estadisticas =
    meta.estadisticas_fuentes ??
    meta.estadisticasFuentes ??
    meta.resumen?.estadisticas_fuentes ??
    meta.resumen?.fuentes ??
    meta.estado?.estadisticas_fuentes ??
    null;

  const tarjetas = [];

  function extraerNumero(obj){
    if(typeof obj === "number") return obj;

    if(typeof obj === "string" && obj.trim() !== ""){
      const n = Number(obj);
      if(Number.isFinite(n)) return n;
    }

    if(!obj || typeof obj !== "object") return null;

    const campos = [
      "eventos",
      "eventos_recibidos",
      "recibidos",
      "total_eventos",
      "total",
      "count",
      "cantidad",
      "encontrados",
      "obtenidos"
    ];

    for(const campo of campos){
      if(typeof obj[campo] === "number"){
        return obj[campo];
      }
    }

    return null;
  }

  function nombreFuente(nombre){
    const n = normalizarTexto(nombre);

    const nombres = {
      "thesportsdb":"TheSportsDB",
      "espn":"ESPN",
      "sofascore":"Sofascore",
      "whatsportson":"WhatSportsOn",
      "relevo":"Relevo",
      "futbolentv":"FutbolEnLaTV",
      "futbol en la tv":"FutbolEnLaTV",
      "marca_tv":"MARCA_TV",
      "marcatv":"MARCA_TV",
      "marca":"MARCA_TV"
    };

    return nombres[n] || String(nombre).replace(/_/g," ");
  }

  function añadirTarjeta(nombre, numero, detalle){
    tarjetas.push({
      nombre: nombreFuente(nombre),
      numero,
      detalle: detalle || ""
    });
  }

  if(Array.isArray(estadisticas)){
    estadisticas.forEach(item => {
      if(!item || typeof item !== "object") return;

      const nombre =
        item.fuente ??
        item.nombre ??
        item.source ??
        item.origen ??
        "Fuente";

      const numero = extraerNumero(item);

      const detalle =
        item.detalle ??
        item.estado ??
        item.mensaje ??
        item.error ??
        "";

      añadirTarjeta(nombre, numero, detalle);
    });
  }else if(estadisticas && typeof estadisticas === "object"){
    Object.entries(estadisticas).forEach(([nombre, dato]) => {
      if(
        nombre === "total" ||
        nombre === "actualizado" ||
        nombre === "fecha"
      ) return;

      const numero = extraerNumero(dato);

      let detalle = "";

      if(dato && typeof dato === "object"){
        detalle =
          dato.detalle ??
          dato.estado ??
          dato.mensaje ??
          dato.error ??
          "";
      }

      añadirTarjeta(nombre, numero, detalle);
    });
  }

  /*
    Si no hay estadísticas de ejecución en el JSON,
    contar los eventos atribuidos a cada fuente.
    Se identifica claramente que es un recuento de eventos
    del archivo, no el número devuelto por el recopilador.
  */
  if(!tarjetas.length){
    const recuentos = {};

    ev.forEach(evento => {
      (evento.fuentes || []).forEach(fuente => {
        const nombre = String(fuente).trim();
        if(!nombre) return;
        recuentos[nombre] = (recuentos[nombre] || 0) + 1;
      });
    });

    Object.entries(recuentos).forEach(([nombre, numero]) => {
      añadirTarjeta(
        nombre,
        numero,
        "Eventos de esta fuente presentes en el archivo"
      );
    });
  }

  if(!tarjetas.length){
    contenedor.textContent =
      "El archivo de esta fecha no contiene estadísticas por fuente ni atribuciones de fuentes en los eventos.";
    return;
  }

  const grid = document.createElement("div");
  grid.className = "fuentes-grid";

  tarjetas.sort((a,b) => comparar(a.nombre,b.nombre));

  tarjetas.forEach(tarjeta => {
    const caja = document.createElement("div");
    caja.className = "fuente";

    const nombre = document.createElement("div");
    nombre.className = "fuente-nombre";
    nombre.textContent = tarjeta.nombre;

    const numero = document.createElement("div");
    numero.className = "fuente-numero";
    numero.textContent =
      tarjeta.numero === null
        ? "Sin cifra"
        : tarjeta.numero;

    caja.appendChild(nombre);
    caja.appendChild(numero);

    if(tarjeta.detalle){
      const detalle = document.createElement("div");
      detalle.className = "fuente-detalle";
      detalle.textContent = tarjeta.detalle;
      caja.appendChild(detalle);
    }

    grid.appendChild(caja);
  });

  contenedor.appendChild(grid);
}

/* Actualizar las competiciones disponibles */
function actualizarCompeticiones(){
  const deporteSeleccionado = $("d").value;
  const anterior = $("c").value;
  const selector = $("c");

  const futbol = [
    ["la liga", "La Liga"],
    ["premier league england", "Premier League England"],
    ["bundesliga", "Bundesliga"],
    ["uefa champions league", "UEFA Champions League"],
    ["uefa europa league", "UEFA Europa League"],
    ["uefa conference league", "UEFA Conference League"],
    ["copa del rey", "Copa del Rey"]
  ];

  const baloncesto = [
    ["acb", "ACB"],
    ["euroliga", "Euroliga"]
  ];

  selector.innerHTML = "";

  const primera = document.createElement("option");
  primera.value = "";
  primera.textContent = "Todas las competiciones";
  selector.appendChild(primera);

  function añadirGrupo(nombre, competiciones){
    const grupo = document.createElement("optgroup");
    grupo.label = nombre;

    competiciones.forEach(([valor,texto]) => {
      const opcion = document.createElement("option");
      opcion.value = valor;
      opcion.textContent = texto;
      grupo.appendChild(opcion);
    });

    selector.appendChild(grupo);
  }

  if(!deporteSeleccionado || deporteSeleccionado === "Fútbol"){
    añadirGrupo("Fútbol",futbol);
  }

  if(!deporteSeleccionado || deporteSeleccionado === "Baloncesto"){
    añadirGrupo("Baloncesto",baloncesto);
  }

  if([...selector.options].some(o => o.value === anterior)){
    selector.value = anterior;
  }else{
    selector.value = "";
  }
}

/* Países de los canales disponibles */
function actualizarPaises(){
  const anterior = $("p").value;

  const paises = [
    ...new Set(
      ev.flatMap(evento =>
        (evento.canales || [])
          .map(canal => String(canal.pais || "").trim())
          .filter(Boolean)
      )
    )
  ].sort(comparar);

  $("p").innerHTML = "";

  const todos = document.createElement("option");
  todos.value = "";
  todos.textContent = "Todos los países";
  $("p").appendChild(todos);

  paises.forEach(pais => {
    const opcion = document.createElement("option");
    opcion.value = pais;
    opcion.textContent = pais;
    $("p").appendChild(opcion);
  });

  $("p").value = paises.includes(anterior) ? anterior : "";
}

/* Cargar las fechas disponibles */
async function init(){
  try{
    const respuesta = await fetch("data/index.json");

    if(!respuesta.ok){
      throw new Error("No se ha podido cargar el índice de fechas.");
    }

    const indice = await respuesta.json();
    const fechas = (indice.fechas || []).slice().sort();

    if(!fechas.length){
      throw new Error("Todavía no hay fechas disponibles.");
    }

    $("f").min = fechas[0];
    $("f").max = fechas[fechas.length - 1];

    const ahora = new Date();
    ahora.setMinutes(
      ahora.getMinutes() - ahora.getTimezoneOffset()
    );

    const hoy = ahora.toISOString().slice(0,10);

    $("f").value = fechas.includes(hoy) ? hoy : fechas[0];

    await cargar();

  }catch(error){
    $("st").textContent =
      "No se han podido cargar los datos. Comprueba data/index.json y GitHub Pages.";
    $("fuentes-contenido").textContent = error.message;
  }
}

/* Cargar los eventos de la fecha elegida */
async function cargar(){
  $("st").textContent = "Cargando programación…";
  $("out").innerHTML = "";
  $("fuentes-contenido").textContent = "Cargando estadísticas…";

  try{
    if(!$("f").value){
      throw new Error("Selecciona una fecha.");
    }

    const respuesta = await fetch(
      `data/${$("f").value}.json?t=${Date.now()}`,
      {cache:"no-store"}
    );

    if(!respuesta.ok){
      throw new Error("No hay datos disponibles para esa fecha.");
    }

    const datos = await respuesta.json();

    ev = datos.eventos || [];
    meta = datos;

    actualizarPaises();
    actualizarCompeticiones();
    mostrarFuentes();
    pintar();

  }catch(error){
    $("st").textContent = error.message;
    $("fuentes-contenido").textContent =
      "No se han podido leer las estadísticas de esta fecha.";
    $("out").innerHTML = "";
  }
}

/* Aplicar filtros */
function pintar(){
  const deporteSeleccionado = $("d").value;
  const competicionSeleccionada = $("c").value;
  const paisSeleccionado = $("p").value;
  const busqueda = normalizarTexto($("q").value);

  const filtrados = ev.filter(evento => {
    const deporte = normalizarDeporte(evento.deporte);
    const clave = claveCompeticion(evento.liga);

    const coincideDeporte =
      !deporteSeleccionado ||
      deporte === deporteSeleccionado;

    const coincideCompeticion =
      !competicionSeleccionada ||
      clave === competicionSeleccionada;

    const coincidePais =
      !paisSeleccionado ||
      (evento.canales || []).some(canal =>
        String(canal.pais || "").trim() === paisSeleccionado
      );

    const texto = normalizarTexto([
      evento.nombre,
      evento.liga,
      evento.deporte,
      ...(evento.fuentes || []),
      ...(evento.canales || []).flatMap(canal => [
        canal.canal,
        canal.pais
      ])
    ].join(" "));

    const coincideBusqueda =
      !busqueda || texto.includes(busqueda);

    return coincideDeporte &&
      coincideCompeticion &&
      coincidePais &&
      coincideBusqueda;
  });

  let actualizado = "desconocido";

  if(meta.actualizado){
    const fechaActualizacion = new Date(meta.actualizado);

    if(!isNaN(fechaActualizacion)){
      actualizado = fechaActualizacion.toLocaleString("es-ES");
    }
  }

  $("st").textContent =
    `${filtrados.length} eventos mostrados · Actualizado: ${actualizado}`;

  if(!filtrados.length){
    $("out").innerHTML =
      '<div class="vacio">No hay eventos que coincidan con los filtros seleccionados.</div>';
    return;
  }

  const grupos = {};

  filtrados.forEach(evento => {
    const deporte = normalizarDeporte(evento.deporte);

    if(!grupos[deporte]) grupos[deporte] = [];
    grupos[deporte].push(evento);
  });

  const ordenPreferido = ["Baloncesto","Fútbol","MotoGP"];

  const nombresGrupos = Object.keys(grupos).sort((a,b) => {
    const ia = ordenPreferido.indexOf(a);
    const ib = ordenPreferido.indexOf(b);

    if(ia !== -1 && ib !== -1) return ia - ib;
    if(ia !== -1) return -1;
    if(ib !== -1) return 1;

    return comparar(a,b);
  });

  $("out").innerHTML = nombresGrupos.map(deporte => {
    const eventos = grupos[deporte].sort((a,b) =>
      String(a.ts || "").localeCompare(String(b.ts || ""))
    );

    const tarjetas = eventos.map(evento => {
      const canalesPorPais = {};

      (evento.canales || [])
        .filter(canal =>
          !paisSeleccionado ||
          String(canal.pais || "").trim() === paisSeleccionado
        )
        .forEach(canal => {
          const pais = String(
            canal.pais || "País sin confirmar"
          ).trim();

          if(!canalesPorPais[pais]){
            canalesPorPais[pais] = [];
          }

          canalesPorPais[pais].push(
            canal.canal || "Canal sin confirmar"
          );
        });

      const canalesHtml = Object.keys(canalesPorPais)
        .sort(comparar)
        .map(pais => {
          const nombres = [...new Set(canalesPorPais[pais])];

          return `<div class="ch"><b>${esc(pais)}:</b> ${
            esc(nombres.join(", "))
          }</div>`;
        }).join("") ||
        '<div class="ch">Canal sin confirmar</div>';

      const competicion = evento.liga
        ? ` · ${esc(normalizarCompeticion(evento.liga))}`
        : "";

      const fuentes = (evento.fuentes || []).length
        ? ` · Fuentes: ${esc(evento.fuentes.join(", "))}`
        : "";

      return `
        <div class="ev">
          <h3>${esc(evento.nombre || "Evento deportivo")}</h3>
          <div class="meta">
            ${esc(hora(evento.ts))}${competicion}${fuentes}
          </div>
          ${canalesHtml}
        </div>
      `;
    }).join("");

    return `<h2>${esc(deporte)}</h2>${tarjetas}`;
  }).join("");
}

/* Escapar texto para mostrarlo de forma segura */
function esc(valor){
  return String(valor ?? "").replace(/[&<>"']/g,caracter => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[caracter]);
}

/* Controles */
$("f").addEventListener("change",cargar);

$("d").addEventListener("change",() => {
  actualizarCompeticiones();
  pintar();
});

$("c").addEventListener("change",pintar);
$("p").addEventListener("change",pintar);
$("q").addEventListener("input",pintar);

init();
</script>
</body>
</html>
