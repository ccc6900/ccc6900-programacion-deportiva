    </div>

    <div class="campo">
      <label for="c">Competición</label>
      <select id="c">
        <option value="">Todas las competiciones</option>
      </select>

    <div class="campo">
      <label for="pais">País / zona del canal</label>
      <select id="pais">
        <option value="">Todos los países</option>
      </select>
    </div>

    <div class="campo">
      <label for="buscar">Buscar partido, competición o canal</label>
      <input id="buscar" type="search" placeholder="Escribe para buscar...">
    </div>
  </section>

  <div id="resumen" class="resumen">Cargando programación...</div>
  <div id="resultados"></div>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

let eventos = [];
let datosCargados = false;

function normalizarTexto(valor) {
  return String(valor ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

function sinDuplicados(lista) {
  return [...new Set(lista.filter(Boolean))];
}

function normalizarDeporte(deporte) {
  const d = normalizarTexto(deporte);

  if (!d) return "Otros deportes";

  if (d.includes("motogp") || d.includes("moto gp")) {
    return "MotoGP";
  }

  if (
    d.includes("american football") ||
    d.includes("futbol americano")
  ) {
    return "Fútbol americano";
  }

  if (
    d === "football" ||
    d === "soccer" ||
    d.includes("soccer") ||
    d.includes("futbol") ||
    d.includes("football")
  ) {
    return "Fútbol";
  }

  if (
    d.includes("basketball") ||
    d.includes("baloncesto")
  ) {
    return "Baloncesto";
  }

  const traducciones = [
    [/tennis|tenis/, "Tenis"],
    [/cycling|ciclismo/, "Ciclismo"],
    [/formula ?1|f1 racing/, "Fórmula 1"],
    [/motor.?sport|motorsport/, "Deportes de motor"],
    [/handball|balonmano/, "Balonmano"],
    [/volleyball|voleibol/, "Voleibol"],
    [/rugby/, "Rugby"],
    [/ice hockey|hockey sobre hielo/, "Hockey sobre hielo"],
    [/hockey/, "Hockey"],
    [/baseball|beisbol/, "Béisbol"],
    [/cricket/, "Críquet"],
    [/golf/, "Golf"],
    [/boxing|boxeo/, "Boxeo"],
    [/mma|mixed martial arts/, "Artes marciales mixtas"],
    [/athletics|atletismo/, "Atletismo"],
    [/swimming|natacion/, "Natación"],
    [/table tennis|tenis de mesa/, "Tenis de mesa"],
    [/badminton/, "Bádminton"],
    [/darts|dardos/, "Dardos"],
    [/snooker|billiards|billars/, "Billar"],
    [/esports|e-sports/, "Deportes electrónicos"]
  ];

  for (const [patron, nombre] of traducciones) {
    if (patron.test(d)) return nombre;
  }

  return String(deporte).trim() || "Otros deportes";
}

function normalizarCompeticion(liga) {
  const l = normalizarTexto(liga);

  if (!l) return "Sin competición";

  if (
    l.includes("copa del rey") ||
    l.includes("copa rey")
  ) {
    return "Copa del Rey";
  }

  if (
    l.includes("conference league") ||
    l.includes("uefa conference")
  ) {
    return "UEFA Conference League";
  }

  if (
    l.includes("europa league") ||
    l.includes("europe league")
  ) {
    return "UEFA Europa League";
  }

  if (
    l.includes("champions league") ||
    l.includes("uefa champions")
  ) {
    return "UEFA Champions League";
  }

  if (
    l === "acb" ||
    l.includes("liga endesa") ||
    l.includes("liga acb")
  ) {
    return "ACB";
  }

  if (
    l.includes("euroliga") ||
    l.includes("euro liga") ||
    l.includes("euroleague")
  ) {
    return "Euroliga";
  }

  if (
    l.includes("premier league") &&
    (l.includes("england") || l.includes("english") ||
     l.includes("ingles") || l === "premier league")
  ) {
    return "Premier League England";
  }

  if (l.includes("bundesliga")) {
    return "Bundesliga";
  }

  if (
    l === "la liga" ||
    l.includes("laliga") ||
    l.includes("primera division") ||
    l.includes("spanish la liga")
  ) {
    return "La Liga";
  }

  return String(liga).trim() || "Sin competición";
}

function claveCompeticion(liga) {
  return normalizarTexto(normalizarCompeticion(liga));
}

function obtenerDeporte(evento) {
  return normalizarDeporte(
    evento.deporte ??
    evento.sport ??
    evento.strSport ??
    evento.categoria ??
    evento.category ??
    ""
  );
}

function obtenerLiga(evento) {
  return normalizarCompeticion(
    evento.liga ??
    evento.competicion ??
    evento.competition ??
    evento.league ??
    evento.strLeague ??
    evento.torneo ??
    ""
  );
}

function obtenerPartido(evento) {
  const local =
    evento.local ??
    evento.equipo_local ??
    evento.home ??
    evento.homeTeam ??
    evento.strHomeTeam ??
    "";

  const visitante =
    evento.visitante ??
    evento.equipo_visitante ??
    evento.away ??
    evento.awayTeam ??
    evento.strAwayTeam ??
    "";

  if (local && visitante) {
    return `${local} - ${visitante}`;
  }

  return (
    evento.partido ??
    evento.evento ??
    evento.nombre ??
    evento.name ??
    evento.strEvent ??
    evento.titulo ??
    "Evento deportivo"
  );
}

function obtenerFecha(evento) {
  return (
    evento.fecha ??
    evento.date ??
    evento.fecha_inicio ??
    evento.start_date ??
    evento.strTimestamp ??
    ""
  );
}

function obtenerHora(evento) {
  let valor =
    evento.hora ??
    evento.time ??
    evento.horario ??
    evento.strTime ??
    "";

  if (!valor) {
    const fecha = obtenerFecha(evento);
    if (typeof fecha === "string" && fecha.includes("T")) {
      valor = fecha.split("T")[1].slice(0, 5);
    }
  }

  if (typeof valor === "string") {
    const coincidencia = valor.match(/^(\d{1,2}):(\d{2})/);
    if (coincidencia) {
      return `${coincidencia[1].padStart(2, "0")}:${coincidencia[2]}`;
    }
  }

  return valor || "Hora por confirmar";
}

function fechaISO(evento) {
  const valor = obtenerFecha(evento);

  if (!valor) return "";

  if (typeof valor === "string") {
    const coincidencia = valor.match(/\d{4}-\d{2}-\d{2}/);
    if (coincidencia) return coincidencia[0];

    const europea = valor.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (europea) {
      return `${europea[3]}-${europea[2]}-${europea[1]}`;
    }
  }

  return "";
}

function obtenerCanales(evento) {
  let canales =
    evento.canales ??
    evento.canal ??
    evento.channels ??
    evento.tv ??
    evento.television ??
    evento.broadcasts ??
    [];

  if (typeof canales === "string") {
    return canales
      .split(/[,;|]/)
      .map(c => c.trim())
      .filter(Boolean);
  }

  if (!Array.isArray(canales)) {
    if (canales && typeof canales === "object") {
      canales = Object.values(canales);
    } else {
      return [];
    }
  }

  return canales.map(canal => {
    if (typeof canal === "string") return canal;

    if (canal && typeof canal === "object") {
      const nombre =
        canal.nombre ??
        canal.name ??
        canal.canal ??
        canal.channel ??
        canal.strChannel ??
        "";

      const pais =
        canal.pais ??
        canal.country ??
        canal.zona ??
        canal.region ??
        "";

      return pais ? `${nombre} (${pais})` : nombre;
    }

    return "";
  }).filter(Boolean);
}

function obtenerPaises(evento) {
  const paises =
    evento.paises ??
    evento.pais ??
    evento.country ??
    evento.countries ??
    evento.zona ??
    evento.region ??
    "";

  let lista = [];

  if (Array.isArray(paises)) {
    lista = paises;
  } else if (typeof paises === "string" && paises.trim()) {
    lista = paises.split(/[,;|]/);
  }

  obtenerCanales(evento).forEach(canal => {
    const coincidencia = canal.match(/\(([^)]+)\)/);
    if (coincidencia) lista.push(coincidencia[1]);
  });

  return sinDuplicados(lista.map(p => String(p).trim()));
}

function obtenerTodosLosEventos(datos) {
  if (Array.isArray(datos)) return datos;

  if (datos && Array.isArray(datos.eventos)) return datos.eventos;
  if (datos && Array.isArray(datos.events)) return datos.events;
  if (datos && Array.isArray(datos.partidos)) return datos.partidos;
  if (datos && Array.isArray(datos.results)) return datos.results;

  if (datos && typeof datos === "object") {
    const lista = [];

    for (const valor of Object.values(datos)) {
      if (Array.isArray(valor)) {
        lista.push(...valor);
      }
    }

    return lista;
  }

  return [];
}

function crearListaCompeticiones() {
  const selector = $("c");
  const deporteSeleccionado = $("d").value;
  const anterior = selector.value;

  const futbol = [
    ["la liga", "La Liga"],
    ["premier league england", "Premier League England"],
    ["bundesliga", "Bundesliga"],
    ["uefa champions league", "UEFA Champions League"],
    ["uefa europa league", "UEFA Europa League"],
    ["uefa conference league", "UEFA Conference League"],
    ["copa del rey", "Copa del Rey"]
  ];

  const baloncesto = [
    ["acb", "ACB"],
    ["euroliga", "Euroliga"]
  ];

  selector.replaceChildren();

  const todas = document.createElement("option");
  todas.value = "";
  todas.textContent = "Todas las competiciones";
  selector.appendChild(todas);

  function añadirGrupo(nombre, competiciones) {
    const grupo = document.createElement("optgroup");
    grupo.label = nombre;

    for (const [valor, texto] of competiciones) {
      const opcion = document.createElement("option");
      opcion.value = valor;
      opcion.textContent = texto;
      grupo.appendChild(opcion);
    }

    selector.appendChild(grupo);
  }

  if (!deporteSeleccionado || deporteSeleccionado === "Fútbol") {
    añadirGrupo("Fútbol", futbol);
  }

  if (!deporteSeleccionado || deporteSeleccionado === "Baloncesto") {
    añadirGrupo("Baloncesto", baloncesto);
  }

  if ([...selector.options].some(opcion => opcion.value === anterior)) {
    selector.value = anterior;
  } else {
    selector.value = "";
  }
}

function actualizarPaises() {
  const selector = $("pais");
  const anterior = selector.value;
  const paises = sinDuplicados(
    eventos.flatMap(evento => obtenerPaises(evento))
  ).sort((a, b) => a.localeCompare(b, "es"));

  selector.replaceChildren();

  const todos = document.createElement("option");
  todos.value = "";
  todos.textContent = "Todos los países";
  selector.appendChild(todos);

  paises.forEach(pais => {
    const opcion = document.createElement("option");
    opcion.value = normalizarTexto(pais);
    opcion.textContent = pais;
    selector.appendChild(opcion);
  });

  if ([...selector.options].some(opcion => opcion.value === anterior)) {
    selector.value = anterior;
  }
}

function coincidePais(evento, paisSeleccionado) {
  if (!paisSeleccionado) return true;

  return obtenerPaises(evento).some(
    pais => normalizarTexto(pais) === paisSeleccionado
  );
}

function coincideBusqueda(evento, busqueda) {
  if (!busqueda) return true;

  const texto = normalizarTexto([
    obtenerDeporte(evento),
    obtenerLiga(evento),
    obtenerPartido(evento),
    obtenerCanales(evento).join(" "),
    obtenerPaises(evento).join(" ")
  ].join(" "));

  return texto.includes(busqueda);
}

function pintar() {
  const contenedor = $("resultados");
  const deporteSeleccionado = $("d").value;
  const competicionSeleccionada = $("c").value;
  const paisSeleccionado = $("pais").value;
  const busqueda = normalizarTexto($("buscar").value);
  const fechaSeleccionada = $("fecha").value;

  const filtrados = eventos.filter(evento => {
    const deporte = obtenerDeporte(evento);
    const liga = obtenerLiga(evento);
    const clave = claveCompeticion(liga);
    const fechaEvento = fechaISO(evento);

    const coincideDeporte =
      !deporteSeleccionado ||
      deporte === deporteSeleccionado;

    const coincideCompeticion =
      !competicionSeleccionada ||
      clave === competicionSeleccionada;

    const coincideFecha =
      !fechaSeleccionada ||
      !fechaEvento ||
      fechaEvento === fechaSeleccionada;

    return (
      coincideDeporte &&
      coincideCompeticion &&
      coincidePais(evento, paisSeleccionado) &&
      coincideBusqueda(evento, busqueda) &&
      coincideFecha
    );
  });

  filtrados.sort((a, b) => {
    const fechaA = fechaISO(a);
    const fechaB = fechaISO(b);
    const horaA = obtenerHora(a);
    const horaB = obtenerHora(b);

    return `${fechaA} ${horaA}`.localeCompare(`${fechaB} ${horaB}`);
  });

  $("resumen").textContent =
    `${filtrados.length} eventos encontrados` +
    (fechaSeleccionada ? ` para el ${fechaSeleccionada}` : "");

  contenedor.replaceChildren();

  if (!filtrados.length) {
    const mensaje = document.createElement("div");
    mensaje.className = "vacio";
    mensaje.textContent =
      "No se han encontrado eventos con esos filtros. Prueba con otra fecha o selecciona «Todos los deportes».";
    contenedor.appendChild(mensaje);
    return;
  }

  const grupos = new Map();

  filtrados.forEach(evento => {
    const deporte = obtenerDeporte(evento);

    if (!grupos.has(deporte)) {
      grupos.set(deporte, []);
    }

    grupos.get(deporte).push(evento);
  });

  const ordenPreferido = [
    "Fútbol",
    "Baloncesto",
    "MotoGP",
    "Fórmula 1",
    "Tenis",
    "Ciclismo"
  ];

  const nombres = [...grupos.keys()].sort((a, b) => {
    const ia = ordenPreferido.indexOf(a);
    const ib = ordenPreferido.indexOf(b);

    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;

    return a.localeCompare(b, "es");
  });

  nombres.forEach(nombreDeporte => {
    const seccion = document.createElement("section");
    seccion.className = "grupo";

    const titulo = document.createElement("h2");
    titulo.textContent = nombreDeporte;
    seccion.appendChild(titulo);

    grupos.get(nombreDeporte).forEach(evento => {
      const fila = document.createElement("article");
      fila.className = "evento";

      const columnaHora = document.createElement("div");
      columnaHora.className = "hora";
      columnaHora.textContent = obtenerHora(evento);

      const columnaPartido = document.createElement("div");

      const partido = document.createElement("div");
      partido.className = "partido";
      partido.textContent = obtenerPartido(evento);
      columnaPartido.appendChild(partido);

      const detalle = document.createElement("div");
      detalle.className = "detalle";
      detalle.textContent = obtenerLiga(evento);
      columnaPartido.appendChild(detalle);

      const columnaCanales = document.createElement("div");
      columnaCanales.className = "canales";

      const canales = obtenerCanales(evento);

      if (canales.length) {
        canales.forEach(nombreCanal => {
          const etiqueta = document.createElement("span");
          etiqueta.className = "etiqueta";
          etiqueta.textContent = nombreCanal;
          columnaCanales.appendChild(etiqueta);
        });
      } else {
        columnaCanales.textContent = "Canal por confirmar";
      }

      fila.append(columnaHora, columnaPartido, columnaCanales);
      seccion.appendChild(fila);
    });

    contenedor.appendChild(seccion);
  });
}

async function cargar() {
  const rutas = [
    "data/index.json",
    "data/" + $("fecha").value + ".json"
  ];

  $("resumen").textContent = "Cargando programación...";

  let lista = [];
  let errores = [];

  for (const ruta of rutas) {
    try {
      const respuesta = await fetch(ruta + "?t=" + Date.now(), {
        cache: "no-store"
      });

      if (!respuesta.ok) {
        errores.push(`${ruta}: HTTP ${respuesta.status}`);
        continue;
      }

      const datos = await respuesta.json();
      const recibidos = obtenerTodosLosEventos(datos);

      if (recibidos.length) {
        lista.push(...recibidos);
      }
    } catch (error) {
      errores.push(`${ruta}: ${error.message}`);
    }
  }

  const vistos = new Set();

  eventos = lista.filter(evento => {
    const clave = [
      fechaISO(evento),
      obtenerHora(evento),
      normalizarTexto(obtenerDeporte(evento)),
      normalizarTexto(obtenerLiga(evento)),
      normalizarTexto(obtenerPartido(evento))
    ].join("|");

    if (vistos.has(clave)) return false;
    vistos.add(clave);
    return true;
  });

  if (!eventos.length) {
    $("resumen").textContent = "No se ha podido cargar la programación.";

    const mensaje = document.createElement("div");
    mensaje.className = "error";
    mensaje.textContent =
      "No se han encontrado eventos en los archivos de datos. Comprueba que GitHub Actions haya generado data/index.json y los archivos diarios. " +
      (errores.length ? "Detalle: " + errores.join(" · ") : "");

    $("resultados").replaceChildren(mensaje);
    return;
  }

  datosCargados = true;
  crearListaCompeticiones();
  actualizarPaises();
  pintar();
}

function fechaLocalActual() {
  const ahora = new Date();
  const año = ahora.getFullYear();
  const mes = String(ahora.getMonth() + 1).padStart(2, "0");
  const dia = String(ahora.getDate()).padStart(2, "0");

  return `${año}-${mes}-${dia}`;
}
